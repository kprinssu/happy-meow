name: Test

on: [push]
permissions:
  checks: write
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Yarn packages
        run: yarn install
      - name: Run Jest
        run: yarn run jest
